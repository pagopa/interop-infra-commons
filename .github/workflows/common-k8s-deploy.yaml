name: "Deploy Kubernetes Workflow"

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run apply against'
        required: true
        type: string
      timeout_seconds:
        description: 'Kubectl apply / Helm upgrade wait timeout in seconds for Deployments'
        required: false
        type: number
        default: -1
      infra_commons_tag:
        description: 'Tag of the infra-commons repository to use'
        required: false
        type: string
        default: ''
      use_kubectl_diff:
        description: 'Use kubectl diff instead of helm diff'
        required: false
        type: boolean
        default: false
      enable_force_upgrade:
        description: 'Force Helm upgrade for all deployed workloads'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_REGION:
        required: true
      EKS_CLUSTER_NAME:
        required: true

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

env:
  SCRIPTS_FOLDER: "./interop-infra-commons/scripts/helm"

jobs:
  workflow_setup:
    name: Setup steps
    runs-on: [ self-hosted, "run_id:${{ inputs.environment }}-${{ github.run_id }}" ]
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
    outputs:
      microservices: ${{ steps.set-outputs.outputs.microservices }}
      cronjobs: ${{ steps.set-outputs.outputs.cronjobs }}
      microservice_deploy_mode: ${{ steps.set-outputs.outputs.microservice_deploy_mode }}
      cronjob_deploy_mode: ${{ steps.set-outputs.outputs.cronjob_deploy_mode }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set-outputs
        run: |
          set -euo pipefail

          echo "microservices=$(find microservices -type f -path "*/$TARGET_ENVIRONMENT/values.yaml" -exec dirname {} \; | awk -F'/' '{print $2}' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          echo "cronjobs=$(find jobs -type f -path "*/$TARGET_ENVIRONMENT/values.yaml" -exec dirname {} \; | awk -F'/' '{print $2}' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

          MICROSERVICE_COMMON_VALUES_FILE="commons/$TARGET_ENVIRONMENT/values-microservice.yaml"
          MICROSERVICE_DEPLOY_MODE=$(yq -r '.deployMode // "HELM_UPGRADE"' "$MICROSERVICE_COMMON_VALUES_FILE")

          case "$MICROSERVICE_DEPLOY_MODE" in
            HELM_UPGRADE|KUBECTL_APPLY)
              ;;
            *)
              echo "::error file=$MICROSERVICE_COMMON_VALUES_FILE::Unsupported deployMode '$MICROSERVICE_DEPLOY_MODE'. Allowed values: HELM_UPGRADE, KUBECTL_APPLY."
              exit 1
              ;;
          esac

          echo "microservice_deploy_mode=$MICROSERVICE_DEPLOY_MODE" >> "$GITHUB_OUTPUT"
          echo "INFO - Selected microservices deploy mode for '$TARGET_ENVIRONMENT': $MICROSERVICE_DEPLOY_MODE"

          CRONJOB_COMMON_VALUES_FILE="commons/$TARGET_ENVIRONMENT/values-cronjob.yaml"
          CRONJOB_DEPLOY_MODE=$(yq -r '.deployMode // "HELM_UPGRADE"' "$CRONJOB_COMMON_VALUES_FILE")

          case "$CRONJOB_DEPLOY_MODE" in
            HELM_UPGRADE|KUBECTL_APPLY)
              ;;
            *)
              echo "::error file=$CRONJOB_COMMON_VALUES_FILE::Unsupported deployMode '$CRONJOB_DEPLOY_MODE'. Allowed values: HELM_UPGRADE, KUBECTL_APPLY."
              exit 1
              ;;
          esac

          echo "cronjob_deploy_mode=$CRONJOB_DEPLOY_MODE" >> "$GITHUB_OUTPUT"
          echo "INFO - Selected cronjobs deploy mode for '$TARGET_ENVIRONMENT': $CRONJOB_DEPLOY_MODE"

  deploy_common_configmaps:
    name: Deploy Common Configmaps
    needs: [ workflow_setup ]
    runs-on: [ self-hosted, "run_id:${{ inputs.environment }}-${{ github.run_id }}" ]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update Kubeconfig
        id: update_kubeconfig
        run: |
          set -euo pipefail

          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}
      - name: Apply commons configmaps
        id: apply_commons_configmap
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          commons_configmaps_path="commons/$ENVIRONMENT/configmaps"

          if [[ -n "$(ls -A $commons_configmaps_path)" ]]; then
            for f in $commons_configmaps_path/*; do
              kubectl apply -f $f
            done;
          fi

  deploy_ms:
    name: ${{ matrix.target }}
    needs: [ workflow_setup, deploy_common_configmaps ]
    if: ${{ ! contains(needs.workflow_setup.outputs.microservices, '[]') }}
    secrets: inherit
    strategy:
      matrix:
        target: ${{ fromJson(needs.workflow_setup.outputs.microservices) }}
      fail-fast: false
    uses: ./.github/workflows/common-k8s-deploy-sub.yaml
    with:
      environment: ${{ inputs.environment }}
      timeout_seconds: ${{ inputs.timeout_seconds }}
      kind: "microservice"
      target: ${{ matrix.target }}
      infra_commons_tag: ${{ inputs.infra_commons_tag }}
      use_kubectl_diff: ${{ inputs.use_kubectl_diff }}
      enable_force_upgrade: ${{ inputs.enable_force_upgrade }}
      deploy_mode: ${{ needs.workflow_setup.outputs.microservice_deploy_mode }}

  deploy_cj:
    name: ${{ matrix.target }}
    needs: [ workflow_setup, deploy_common_configmaps ]
    if: ${{ ! contains(needs.workflow_setup.outputs.cronjobs, '[]') }}
    secrets: inherit
    strategy:
      matrix:
        target: ${{ fromJson(needs.workflow_setup.outputs.cronjobs) }}
      fail-fast: false
    uses: ./.github/workflows/common-k8s-deploy-sub.yaml
    with:
      environment: ${{ inputs.environment }}
      timeout_seconds: ${{ inputs.timeout_seconds }}
      kind: "cronjob"
      target: ${{ matrix.target }}
      infra_commons_tag: ${{ inputs.infra_commons_tag }}
      use_kubectl_diff: ${{ inputs.use_kubectl_diff }}
      enable_force_upgrade: ${{ inputs.enable_force_upgrade }}
      deploy_mode: ${{ needs.workflow_setup.outputs.cronjob_deploy_mode }}
