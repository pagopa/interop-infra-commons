name: Validation Steps

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        type: string
      infra_commons_tag:
        required: false
        type: string
      enable_kube_linter:
        description: 'Enable Kube-linter validation'
        required: false
        type: string
        default: 'false'
      enable_argocd_schema_validation:
        description: 'Enable ArgoCD schema validation'
        required: false
        type: string
        default: 'false'
      enable_argocd_validation:
        description: 'Enable ArgoCD validation'
        required: false
        type: string
        default: 'false'
      repo_structure_validation_warning_only:
        description: 'Enable warning only mode for repo structure validation'
        required: false
        type: string
        default: 'false'
          
defaults:
  run:
    shell: bash

env:
  HELM_SCRIPTS_FOLDER: "./interop-infra-commons/scripts/helm"
  VALIDATION_SCRIPTS_FOLDER: "./interop-infra-commons/scripts/validation"

jobs:
  repo_structure_validation:
    name: Repo Structure Validation
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29

      - name: Checkout scripts repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          repository: pagopa/interop-infra-commons
          path: interop-infra-commons
          fetch-depth: 0
          sparse-checkout: 'scripts/validation'
          ref: ${{ inputs.infra_commons_tag }}
          
      - name: Run repository structure checks
        env:
          REPO_STRUCTURE_VALIDATION_WARNING_ONLY: ${{ inputs.repo_structure_validation_warning_only }}
          ENABLE_ARGOCD_VALIDATION: ${{ inputs.enable_argocd_validation }}
          ENABLE_ARGOCD_SCHEMA_VALIDATION: ${{ inputs.enable_argocd_schema_validation }}
        run: |
          set -euo pipefail

          WARNING_ONLY_ARG=""
          if [[ "${REPO_STRUCTURE_VALIDATION_WARNING_ONLY:-false}" == "true" ]]; then
            WARNING_ONLY_ARG="--warning-only"
          fi

          bash "$VALIDATION_SCRIPTS_FOLDER/validate-repo-structure.sh" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --target-env "${{ inputs.environment }}" \
            --legacy-exceptions-file docs/repo-structure-validation-exceptions.txt \
            --enable-argocd-validation "${ENABLE_ARGOCD_VALIDATION}" \
            --enable-argocd-schema-validation "${ENABLE_ARGOCD_SCHEMA_VALIDATION}" \
            ${WARNING_ONLY_ARG}
            
  chart_validation:
    name: Helm Chart validation
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        chartType: ["microservice", "cronjob"]
      fail-fast: false
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
      
      - name: Checkout scripts repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          repository: pagopa/interop-infra-commons
          path: interop-infra-commons
          fetch-depth: 0
          sparse-checkout: 'scripts/helm'
          ref: ${{ inputs.infra_commons_tag }}
      
      - name: Helm Chart Linting
        id: helm_lint
        env:
          CHART_TYPE: ${{ matrix.chartType }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          OPTIONS=""

          if [[ $CHART_TYPE == "microservice" ]]; then
            OPTIONS=" --microservices "
          elif [[ $CHART_TYPE == "cronjob" ]]; then
            OPTIONS=" --jobs "
          else
            echo "::error:: Workflow cannot be run on selected chart $CHART_TYPE"
            exit 1
          fi

          export PROJECT_DIR=$(pwd)

          $HELM_SCRIPTS_FOLDER/helmLint-main.sh --debug --environment "$ENVIRONMENT" --output console $OPTIONS -i $PROJECT_DIR/commons/"$ENVIRONMENT"/images.yaml
  
  workloads_discovery:
    name: Workloads Discovery
    needs: [ chart_validation ]
    runs-on: ubuntu-22.04
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
    outputs:
      microservices: ${{ steps.discovery.outputs.microservices }}
      cronjobs: ${{ steps.discovery.outputs.cronjobs }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
      - id: discovery
        run: |
          echo "Discovering workloads for environment $TARGET_ENVIRONMENT"
          echo "microservices discovered: $(find microservices -type f -path "*/$TARGET_ENVIRONMENT/values.yaml" -exec dirname {} \; | awk -F'/' '{print $2}' | jq -R -s -c 'split("\n")[:-1]')"
          echo "cronjobs discovered: $(find jobs -type f -path "*/$TARGET_ENVIRONMENT/values.yaml" -exec dirname {} \; | awk -F'/' '{print $2}' | jq -R -s -c 'split("\n")[:-1]')"
          echo "microservices=$(find microservices -type f -path "*/$TARGET_ENVIRONMENT/values.yaml" -exec dirname {} \; | awk -F'/' '{print $2}' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          echo "cronjobs=$(find jobs -type f -path "*/$TARGET_ENVIRONMENT/values.yaml" -exec dirname {} \; | awk -F'/' '{print $2}' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  kube_linter_setup:
    name: Kube-linter Setup
    runs-on: ubuntu-22.04
    if: ${{ inputs.enable_kube_linter == 'true' }}
    steps:
      - name: Download kube-linter binary
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -sSLO https://github.com/stackrox/kube-linter/releases/download/v0.7.1/kube-linter-linux.tar.gz
          tar -xzf kube-linter-linux.tar.gz -C .tools kube-linter
          chmod +x .tools/kube-linter
          rm kube-linter-linux.tar.gz
          ./.tools/kube-linter version

      - name: Upload kube-linter artifact
        uses: actions/upload-artifact@v4
        with:
          name: kube-linter-linux
          path: .tools/kube-linter
          if-no-files-found: error

  template_microservices:
    name: ${{ matrix.microservice }}
    needs: [ workloads_discovery ]
    runs-on: ubuntu-22.04
    if: ${{ ! contains(needs.workloads_discovery.outputs.microservices, '[]') }}
    strategy:
      matrix:
        microservice: ${{ fromJson(needs.workloads_discovery.outputs.microservices) }}
      fail-fast: false
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29

      - name: Checkout scripts repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          repository: pagopa/interop-infra-commons
          path: interop-infra-commons 
          fetch-depth: 0
          sparse-checkout: 'scripts/helm'
          ref: ${{ inputs.infra_commons_tag }}

      - name: Download kube-linter artifact
        uses: actions/download-artifact@v4
        if: ${{ inputs.enable_kube_linter == 'true' }}
        with:
          name: kube-linter-linux
          path: .tools

      - name: Setup kube-linter is executable
        if: ${{ inputs.enable_kube_linter == 'true' }}
        run: |
          set -euo pipefail
          
          chmod +x .tools/kube-linter
          echo "$PWD/.tools" >> "$GITHUB_PATH"

      - name: Helm Template Microservice
        id: helm_template_ms
        env:
          MICROSERVICE_NAME: ${{ matrix.microservice }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          
          export PROJECT_DIR=$(pwd)
          
          $HELM_SCRIPTS_FOLDER/helmTemplate-svc-single.sh --disable-templating-lookup --debug --environment "$ENVIRONMENT" --microservice $MICROSERVICE_NAME -i $PROJECT_DIR/commons/"$ENVIRONMENT"/images.yaml --output console

      - name: Microservice Kube-Linter
        id: microservice_kube_linter
        if: ${{ inputs.enable_kube_linter == 'true' }}
        env:
          MICROSERVICE_NAME: ${{ matrix.microservice }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          export PROJECT_DIR=$(pwd)

          $HELM_SCRIPTS_FOLDER/helmTemplate-svc-single.sh --disable-templating-lookup --debug --skip-dep --environment "$ENVIRONMENT" --microservice $MICROSERVICE_NAME -i $PROJECT_DIR/commons/"$ENVIRONMENT"/images.yaml --output console | kube-linter lint -
      
  template_cronjobs:
    name: ${{ matrix.cronjob }}
    needs: [ workloads_discovery ]
    runs-on: ubuntu-22.04
    if: ${{ ! contains(needs.workloads_discovery.outputs.cronjobs, '[]') }}
    strategy:
      matrix:
        cronjob: ${{ fromJson(needs.workloads_discovery.outputs.cronjobs) }}
      fail-fast: false
    steps:    
      - name: Checkout
        id: checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29

      - name: Checkout scripts repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          repository: pagopa/interop-infra-commons
          path: interop-infra-commons 
          fetch-depth: 0
          sparse-checkout: 'scripts/helm'
          ref: ${{ inputs.infra_commons_tag }}

      - name: Download kube-linter artifact
        if: ${{ inputs.enable_kube_linter == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: kube-linter-linux
          path: .tools

      - name: Setup kube-linter
        if: ${{ inputs.enable_kube_linter == 'true' }}
        run: |
          set -euo pipefail

          chmod +x .tools/kube-linter
          echo "$PWD/.tools" >> "$GITHUB_PATH"
        
      - name: Helm Chart Template
        id: helm_template
        env:
          CRONJOB_NAME: ${{ matrix.cronjob }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          
          export PROJECT_DIR=$(pwd)

          $HELM_SCRIPTS_FOLDER/helmTemplate-cron-single.sh --debug --environment "$ENVIRONMENT" --job $CRONJOB_NAME -i $PROJECT_DIR/commons/"$ENVIRONMENT"/images.yaml --output console

      - name: Cronjob Kube-Linter
        id: cronjob_kube_linter
        if: ${{ inputs.enable_kube_linter == 'true' }}
        env:
          CRONJOB_NAME: ${{ matrix.cronjob }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          export PROJECT_DIR=$(pwd)

          $HELM_SCRIPTS_FOLDER/helmTemplate-cron-single.sh --disable-templating-lookup --debug --skip-dep --environment "$ENVIRONMENT" --job $CRONJOB_NAME -i $PROJECT_DIR/commons/"$ENVIRONMENT"/images.yaml --output console | kube-linter lint -
