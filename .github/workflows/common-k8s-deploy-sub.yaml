name: "Deploy Kubernetes Microservices and Cronjobs"

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run apply against'
        required: true
        type: string
      timeout_seconds:
        description: 'Optional Deployment rollout timeout in seconds; 0 skips waiting and negative values use the dynamic timeout'
        required: false
        type: number
        default: -1
      kind:
        description: 'Kind of resource to deploy (microservice or cronjob)'
        required: true
        type: string
      target:
        description: 'Name of the target resource to deploy'
        required: true
        type: string
      infra_commons_tag:
        description: 'Tag of the infra-commons repository to use'
        required: false
        type: string
        default: ''
      use_kubectl_diff:
        description: 'Use kubectl diff instead of helm diff'
        required: false
        type: boolean
        default: false
      enable_force_upgrade:
        description: 'Enable force upgrade for Helm deployments'
        required: false
        type: boolean
        default: false
      deploy_mode:
        description: 'Deploy mode to use (HELM_UPGRADE or KUBECTL_APPLY)'
        required: true
        type: string
    secrets:
      AWS_REGION:
        description: 'AWS region for EKS cluster'
        required: true
      EKS_CLUSTER_NAME:
        description: 'Name of the EKS cluster'
        required: true

defaults:
  run:
    shell: bash

env:
  SCRIPTS_FOLDER: "./interop-infra-commons/scripts/helm"

jobs:
  deploy_workflow:
    runs-on: [ self-hosted, "run_id:${{ inputs.environment }}-${{ github.run_id }}" ]
    environment: ${{ inputs.environment }}
    name: "${{ inputs.target }}"
    steps:
      - name: Check inputs
        id: check_inputs
        env:
          KIND: ${{ inputs.kind }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail

          microservice_defined=false
          cronjob_defined=false

          if [[ "$KIND" != "microservice" && "$KIND" != "cronjob" ]]; then
            echo "::error::Invalid value for 'kind'. Allowed values are 'microservice' and 'cronjob'."
            exit 1
          fi

          if [[ ! "$TIMEOUT_SECONDS" =~ ^-?[0-9]+$ ]]; then
            echo "::error::'timeout_seconds' must be an integer number of seconds."
            exit 1
          fi
          
          case "$DEPLOY_MODE" in
            HELM_UPGRADE|KUBECTL_APPLY)
              ;;
            *)
              echo "::error::Unsupported deployMode '$DEPLOY_MODE'. Allowed values: HELM_UPGRADE, KUBECTL_APPLY."
              exit 1
              ;;
          esac

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout infra-commons scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pagopa/interop-infra-commons
          path: interop-infra-commons
          fetch-depth: 0
          sparse-checkout: 'scripts/helm'
          ref: ${{ inputs.infra_commons_tag || github.ref }}

      - name: Set kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Helm Template
        id: helm_template
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TARGET: ${{ inputs.target }}
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          export PROJECT_DIR=$(pwd)

          if [[ "$KIND" == "microservice" ]]; then
            $SCRIPTS_FOLDER/helmTemplate-svc-single.sh \
              --debug \
              --environment $ENVIRONMENT \
              --microservice $TARGET \
              -i $PROJECT_DIR/commons/$ENVIRONMENT/images.yaml \
              --output console

          else
            $SCRIPTS_FOLDER/helmTemplate-cron-single.sh \
              --debug \
              --environment $ENVIRONMENT \
              --job $TARGET \
              -i $PROJECT_DIR/commons/$ENVIRONMENT/images.yaml \
              --output console
          fi

      - name: Diff
        id: diff
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TARGET: ${{ inputs.target }}
          USE_KUBECTL_DIFF: ${{ inputs.use_kubectl_diff }}
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail

          export PROJECT_DIR=$(pwd)
          DIFF_EXIT_CODE=1

          if [[ "$KIND" == "microservice" ]]; then
            set +e
            if [[ "$USE_KUBECTL_DIFF" == "true" ]]; then
              $SCRIPTS_FOLDER/kubectlDiff-svc-single-standalone.sh \
                --skip-dep \
                --environment $ENVIRONMENT \
                --microservice $TARGET \
                -i $PROJECT_DIR/commons/$ENVIRONMENT/images.yaml \
                --output console
            else
              $SCRIPTS_FOLDER/helmDiff-svc-single-standalone.sh \
                --skip-dep \
                --environment $ENVIRONMENT \
                --microservice $TARGET \
                -i $PROJECT_DIR/commons/$ENVIRONMENT/images.yaml
            fi
            DIFF_EXIT_CODE=$?
            set -e

          else
            set +e
            if [[ "$USE_KUBECTL_DIFF" == "true" ]]; then
              $SCRIPTS_FOLDER/kubectlDiff-cron-single-standalone.sh \
                --skip-dep \
                --environment $ENVIRONMENT \
                --job $TARGET \
                -i $PROJECT_DIR/commons/$ENVIRONMENT/images.yaml \
                --output console
            else
              $SCRIPTS_FOLDER/helmDiff-cron-single-standalone.sh \
                --skip-dep \
                --environment $ENVIRONMENT \
                --job $TARGET \
                -i $PROJECT_DIR/commons/$ENVIRONMENT/images.yaml
            fi
            DIFF_EXIT_CODE=$?
            set -e
          fi

          if [[ $DIFF_EXIT_CODE -eq 0 ]]; then
            echo "Diff Output: No diff has been found for $TARGET"
          elif [[ $DIFF_EXIT_CODE -le 2 ]]; then
            echo "Diff Output: Diff has been found for $TARGET"
          else
            echo "::error title=Diff Error::Error occurred during diff, exit code $DIFF_EXIT_CODE"
            exit $DIFF_EXIT_CODE
          fi

      - name: Deploy
        id: deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TARGET: ${{ inputs.target }}
          KIND: ${{ inputs.kind }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          BATCH_WAIT_SECONDS: ${{ vars.BATCH_WAIT_SECONDS }}
          HELM_FORCE_UPGRADE_MS_CSV: ${{ vars.HELM_FORCE_UPGRADE_MICROSERVICES_CSV }}
          HELM_FORCE_UPGRADE_CJ_CSV: ${{ vars.HELM_FORCE_UPGRADE_CRONJOBS_CSV }}
          ENABLE_FORCE_UPGRADE: ${{ inputs.enable_force_upgrade }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
        run: |
          set -euo pipefail

          TIMEOUT_OPT=""
          NOWAIT_OPT=""

          echo "INFO - Deploy mode: $DEPLOY_MODE"
          echo "ENABLE_FORCE_UPGRADE: $ENABLE_FORCE_UPGRADE"

          if [[ "$KIND" == "microservice" ]]; then
            if [[ "$ENABLE_FORCE_UPGRADE" == "true" || "$HELM_FORCE_UPGRADE_MS_CSV" == "*" || ",$HELM_FORCE_UPGRADE_MS_CSV," == *",$TARGET,"* ]]; then
              FORCE_UPGRADE_MS=true
            else
              FORCE_UPGRADE_MS=false
            fi

            if [[ "$TIMEOUT_SECONDS" -eq 0 ]]; then
              echo "::warning::INFO - Helm upgrade will not wait for the deployment to finish."
              NOWAIT_OPT="--no-wait"

            elif [[ "$TIMEOUT_SECONDS" -lt 0 ]]; then
              echo "INFO - No timeout specified for Helm upgrade, using dynamic timeout value."

              TIMEOUT_SECONDS=$(. $SCRIPTS_FOLDER/get-rollout-dynamic-wait.sh --namespace $ENVIRONMENT --deployment $TARGET  --batch-wait ${BATCH_WAIT_SECONDS:-300})

              echo "Dynamic timeout calculated: $TIMEOUT_SECONDS seconds."
              if [[ "$TIMEOUT_SECONDS" -ne "0" ]]; then
                TIMEOUT_OPT="--timeout ${TIMEOUT_SECONDS}s"
              fi

            else
              echo "INFO - Helm upgrade will wait for the deployment to finish."
              TIMEOUT_OPT="--timeout ${TIMEOUT_SECONDS}s"
            fi

          else
            if [[ "$ENABLE_FORCE_UPGRADE" == "true" || "$HELM_FORCE_UPGRADE_CJ_CSV" == '*' || ",$HELM_FORCE_UPGRADE_CJ_CSV," == *",$TARGET,"* ]]; then
              FORCE_UPGRADE_CJ=true
            else
              FORCE_UPGRADE_CJ=false
            fi
          fi

          export PROJECT_DIR=$(pwd)

          if [[ "$KIND" == "microservice" ]]; then
            $SCRIPTS_FOLDER/helmTemplate-svc-single.sh \
              --debug \
              --environment $ENVIRONMENT \
              -m "$TARGET" \
              -i $PROJECT_DIR/commons/$ENVIRONMENT/images.yaml \
              --output "$(pwd)/template.yaml"

            if [[ ! -s "$PROJECT_DIR/template.yaml" ]]; then
              echo "::error::Rendered manifest '$PROJECT_DIR/template.yaml' is missing or empty."
              exit 1
            fi

            K8S_NAMESPACE=$(cat "$PROJECT_DIR/template.yaml" | yq 'select(.kind == "Deployment") | .metadata.namespace')
            MICROSERVICE_FULLNAME=$(cat "$PROJECT_DIR/template.yaml" | yq 'select(.kind == "Deployment") | .metadata.name')

            if [[ -z "$K8S_NAMESPACE" || -z "$MICROSERVICE_FULLNAME" ]]; then
              echo "::error::Unable to resolve Deployment name or namespace from '$PROJECT_DIR/template.yaml'."
              exit 1
            fi

            echo "INFO - Apply changes for $MICROSERVICE_FULLNAME."

            case "$DEPLOY_MODE" in
              HELM_UPGRADE)
                HELM_UPGRADE_OPTIONS="--debug --skip-dep $TIMEOUT_OPT $NOWAIT_OPT --output console"
                if [[ "$FORCE_UPGRADE_MS" == "true" ]]; then
                  echo "INFO - Force upgrade requested for $MICROSERVICE_FULLNAME"
                  HELM_UPGRADE_OPTIONS=$HELM_UPGRADE_OPTIONS" --force"
                fi

                echo "INFO - Deploying $MICROSERVICE_FULLNAME with Helm upgrade."
                "$SCRIPTS_FOLDER/helmUpgrade-svc-single-standalone.sh" \
                  $HELM_UPGRADE_OPTIONS  \
                  --environment "$K8S_NAMESPACE" \
                  -m "$TARGET" \
                  -i "$PROJECT_DIR/commons/$K8S_NAMESPACE/images.yaml"
                ;;                
              KUBECTL_APPLY)
                echo "INFO - Deploying $MICROSERVICE_FULLNAME using kubectl apply"
                if [[ "$FORCE_UPGRADE_MS" == "true" ]]; then
                  echo "::notice::Force-upgrade settings are ignored in KUBECTL_APPLY mode for $MICROSERVICE_FULLNAME."
                fi
                $SCRIPTS_FOLDER/kubectlApply-svc-single-standalone.sh \
                  --debug \
                  --skip-dep \
                  --environment "$K8S_NAMESPACE" \
                  -m "$TARGET" \
                  -i $PROJECT_DIR/commons/$K8S_NAMESPACE/images.yaml \
                  --output console

                DESIRED_REPLICAS=$(kubectl get deployment "$MICROSERVICE_FULLNAME" \
                  --namespace "$K8S_NAMESPACE" \
                  -o jsonpath='{.spec.replicas}')
                DESIRED_REPLICAS=${DESIRED_REPLICAS:-1}
                
                echo "INFO - Desired replicas: $DESIRED_REPLICAS"
                if [[ "$DESIRED_REPLICAS" -eq 0 ]]; then
                  echo "INFO - Desired replicas for $MICROSERVICE_FULLNAME are 0. Skipping rollout wait."
                elif [[ "$TIMEOUT_SECONDS" -eq 0 ]]; then
                  echo "INFO - Rollout wait disabled for $MICROSERVICE_FULLNAME."
                else
                  ROLLOUT_TIMEOUT="${TIMEOUT_SECONDS}s"
                  echo "INFO - Waiting for rollout of $MICROSERVICE_FULLNAME (max $ROLLOUT_TIMEOUT)."
                  if ! kubectl rollout status \
                    --namespace "$K8S_NAMESPACE" \
                    "deployment/$MICROSERVICE_FULLNAME" \
                    --timeout="$ROLLOUT_TIMEOUT" \
                    --watch; then
                    echo "::error::Rollout for $MICROSERVICE_FULLNAME failed or exceeded $ROLLOUT_TIMEOUT."
                    exit 1
                  fi
                  echo "INFO - Rollout for $MICROSERVICE_FULLNAME completed successfully."
                fi
                ;;
              *)
                echo "::error::Unsupported deploy mode '$DEPLOY_MODE'."
                exit 1
                ;;
            esac
                
            echo "Deploy for $MICROSERVICE_FULLNAME completed successfully."

          elif [[ "$KIND" == "cronjob" ]]; then
            $SCRIPTS_FOLDER/helmTemplate-cron-single.sh \
              --debug \
              --environment $ENVIRONMENT \
              --job "$TARGET" \
              -i $PROJECT_DIR/commons/$ENVIRONMENT/images.yaml \
              --output "$PROJECT_DIR/template.yaml"

            if [[ ! -s "$PROJECT_DIR/template.yaml" ]]; then
              echo "::error::Rendered manifest '$PROJECT_DIR/template.yaml' is missing or empty."
              exit 1
            fi

            K8S_NAMESPACE=$(cat "$PROJECT_DIR/template.yaml" | yq 'select(.kind == "CronJob") | .metadata.namespace')
            CRONJOB_FULLNAME=$(cat "$PROJECT_DIR/template.yaml" | yq 'select(.kind == "CronJob") | .metadata.name')

            if [[ -z "$K8S_NAMESPACE" || -z "$CRONJOB_FULLNAME" ]]; then
              echo "::error::Unable to resolve CronJob name or namespace from '$PROJECT_DIR/template.yaml'."
              exit 1
            fi

            echo "Apply changes for $CRONJOB_FULLNAME."

            case "$DEPLOY_MODE" in
              HELM_UPGRADE)
                HELM_UPGRADE_OPTIONS="--debug --skip-dep --output console"
                if [[ "$FORCE_UPGRADE_CJ" == "true" ]]; then
                  echo "INFO - Force upgrade requested for $CRONJOB_FULLNAME"
                  HELM_UPGRADE_OPTIONS=$HELM_UPGRADE_OPTIONS" --force"
                fi

                echo "INFO - Deploying $CRONJOB_FULLNAME with Helm upgrade."
                "$SCRIPTS_FOLDER/helmUpgrade-cron-single-standalone.sh" \
                  $HELM_UPGRADE_OPTIONS \
                  --environment "$K8S_NAMESPACE" \
                  -j "$TARGET" \
                  -i "$PROJECT_DIR/commons/$K8S_NAMESPACE/images.yaml"
                ;;
              KUBECTL_APPLY)
                echo "INFO - Deploying $CRONJOB_FULLNAME by applying the rendered Helm manifest."
                if [[ "$FORCE_UPGRADE_CJ" == "true" ]]; then
                  echo "::notice::Force-upgrade settings are ignored in KUBECTL_APPLY mode for $CRONJOB_FULLNAME."
                fi
                $SCRIPTS_FOLDER/kubectlApply-cron-single-standalone.sh \
                  --debug \
                  --skip-dep \
                  --environment "$K8S_NAMESPACE" \
                  -j "$TARGET" \
                  -i "$PROJECT_DIR/commons/$K8S_NAMESPACE/images.yaml" \
                  --output console
                ;;
              *)
                echo "::error::Unsupported deploy mode '$DEPLOY_MODE'."
                exit 1
                ;;
            esac
          fi
